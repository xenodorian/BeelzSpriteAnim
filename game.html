<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprite</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #stage {
    position: fixed; left: 50%; bottom: 0; z-index: 1;
    height: min(78vh, 730px);
    aspect-ratio: 480 / 730;
    transform: translateX(-50%);
    pointer-events: none;
  }
  #sprite { position: absolute; inset: 0; width: 100%; height: 100%; }
  #slash {
    position: absolute; left: 50%; top: 39.7%;
    width: calc(100% * 730 / 480); height: auto;
    transform: translate(-50%, -50%);
    display: none;
  }
  .pad {
    position: fixed; z-index: 2; bottom: 16px;
    width: 30vw; height: 64px;
    font: 16px/1 ui-sans-serif, system-ui, sans-serif;
    color: #eee; background: #1a1a1a; border: 1px solid #444;
  }
  #left { left: 8px; }
  #right { right: 8px; }
  #slashbtn { left: 50%; transform: translateX(-50%); }
  .pad.down { background: #333; }
</style>
</head>
<body>
<div id="stage">
  <img id="sprite" alt="">
  <img id="slash" alt="" src="https://raw.githubusercontent.com/xenodorian/BeelzSpriteAnim/main/game/slash.png">
</div>
<button id="left" class="pad" type="button">Block</button>
<button id="slashbtn" class="pad" type="button">Slash</button>
<button id="right" class="pad" type="button">Walk</button>
<script>
const RAW = "https://raw.githubusercontent.com/xenodorian/BeelzSpriteAnim/main/game/"
const src = {
  idle: RAW + "idle.png",
  w2: RAW + "walk_a.png",
  w3: RAW + "walk_b.png",
  walk: RAW + "walk.webp",
  b9: RAW + "b9.webp",
  b12: RAW + "b12.webp",
  b18: RAW + "b18.webp",
  b31: RAW + "b31.webp",
  b35: RAW + "b35.webp",
  b33: RAW + "b33.webp",
}
for (const url of Object.values(src)) { const i = new Image(); i.src = url }
new Image().src = RAW + "slash.png"

const sprite = document.getElementById("sprite")
const slash = document.getElementById("slash")
const slashBtn = document.getElementById("slashbtn")
let state = "idle"
let timer = null
let right = false
let left = false

function show(name) {
  if (sprite.dataset.name === name) return
  sprite.dataset.name = name
  sprite.src = src[name]
}
function setSlash(on) { slash.style.display = on ? "block" : "none" }
function clearTimer() {
  if (timer) { clearTimeout(timer); timer = null }
}
function goIdle() {
  clearTimer()
  state = "idle"
  setSlash(false)
  slashBtn.classList.remove("down")
  show("idle")
}
function after(ms, fn) { timer = setTimeout(fn, ms) }

function startWalk() {
  clearTimer()
  setSlash(false)
  state = "toWalk"
  const steps = ["w2", "w3"]
  let i = 0
  function next() {
    if (!right) { goIdle(); return }
    if (i >= steps.length) { state = "walking"; show("walk"); return }
    show(steps[i++])
    after(100, next)
  }
  next()
}
function startBlock() {
  clearTimer()
  setSlash(false)
  state = "toBlock"
  const steps = ["b9", "b12"]
  let i = 0
  function next() {
    if (!left) { startRecover(); return }
    if (i >= steps.length) { state = "blocking"; show("b18"); return }
    show(steps[i++])
    after(50, next)
  }
  next()
}
function startRecover() {
  clearTimer()
  setSlash(false)
  state = "fromBlock"
  const steps = ["b31", "b35"]
  let i = 0
  function next() {
    if (i >= steps.length) {
      goIdle()
      if (left) startBlock()
      else if (right) startWalk()
      return
    }
    show(steps[i++])
    after(90, next)
  }
  next()
}
function startSlash() {
  clearTimer()
  state = "slashWind"
  setSlash(false)
  slashBtn.classList.add("down")
  show("b12")
  after(250, () => {
    if (state !== "slashWind") return
    state = "slashHit"
    show("b33")
    setSlash(true)
    after(100, () => {
      if (state !== "slashHit") return
      setSlash(false)
      after(100, () => {
        if (state !== "slashHit") return
        const resumeLeft = left
        const resumeRight = right
        goIdle()
        if (resumeLeft) startBlock()
        else if (resumeRight) startWalk()
      })
    })
  })
}

function pressRight() {
  if (right) return
  right = true
  document.getElementById("right").classList.add("down")
  if (state === "slashWind" || state === "slashHit") return
  if (state === "idle") startWalk()
  else if (state === "toBlock" || state === "blocking") { left = false; document.getElementById("left").classList.remove("down"); startWalk() }
}
function releaseRight() {
  if (!right) return
  right = false
  document.getElementById("right").classList.remove("down")
  if (state === "toWalk" || state === "walking") goIdle()
}
function pressLeft() {
  if (left) return
  left = true
  document.getElementById("left").classList.add("down")
  if (state === "slashWind" || state === "slashHit") return
  if (state === "idle") startBlock()
  else if (state === "toWalk" || state === "walking") { right = false; document.getElementById("right").classList.remove("down"); startBlock() }
}
function releaseLeft() {
  if (!left) return
  left = false
  document.getElementById("left").classList.remove("down")
  if (state === "toBlock" || state === "blocking") startRecover()
}
function pressSlash() {
  if (state === "slashWind" || state === "slashHit") return
  if (state === "toBlock" || state === "blocking" || state === "fromBlock") return
  if (state === "toWalk" || state === "walking") {
    right = false
    document.getElementById("right").classList.remove("down")
  }
  startSlash()
}

function bind(id, down, up) {
  const el = document.getElementById(id)
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); down() })
  if (up) {
    el.addEventListener("pointerup", up)
    el.addEventListener("pointercancel", up)
  }
}
bind("right", pressRight, releaseRight)
bind("left", pressLeft, releaseLeft)
bind("slashbtn", pressSlash, null)

addEventListener("keydown", (e) => {
  if (e.repeat) return
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { e.preventDefault(); pressRight() }
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { e.preventDefault(); pressLeft() }
  if (e.key === "ArrowUp" || e.key === " " || e.key === "w" || e.key === "W") { e.preventDefault(); pressSlash() }
})
addEventListener("keyup", (e) => {
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") releaseRight()
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") releaseLeft()
})
goIdle()
</script>
</body>
</html>
