<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprite</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #stage {
    position: fixed; left: 50%; bottom: 0; z-index: 1;
    height: min(78vh, 730px);
    aspect-ratio: 480 / 730;
    transform: translateX(-50%);
    pointer-events: none;
  }
  #sprite { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  #glow, #slash {
    position: absolute; left: 50%;
    top: calc(39.7% + 100% * 17 / 730);
    width: 200%;
    aspect-ratio: 960 / 34;
    height: auto;
    transform: translate(-50%, -50%);
    display: none;
  }
  #glow {
    z-index: 2;
    filter: blur(10px) brightness(1.8);
    opacity: 0.9;
    transform: translate(-50%, -50%) scale(1.35);
  }
  #slash { z-index: 3; }
</style>
</head>
<body>
<div id="stage">
  <img id="sprite" alt="">
  <img id="glow" alt="" src="https://raw.githubusercontent.com/xenodorian/BeelzSpriteAnim/main/game/energy.png">
  <img id="slash" alt="" src="https://raw.githubusercontent.com/xenodorian/BeelzSpriteAnim/main/game/energy.png">
</div>
<script>
const RAW = "https://raw.githubusercontent.com/xenodorian/BeelzSpriteAnim/main/game/"
const src = {
  idle: RAW + "idle.png",
  w2: RAW + "walk_a.png",
  w3: RAW + "walk_b.png",
  walk: RAW + "walk.webp",
  b9: RAW + "b9.webp",
  b12: RAW + "b12.webp",
  b18: RAW + "b18.webp",
  b31: RAW + "b31.webp",
  b35: RAW + "b35.webp",
  b33: RAW + "b33.webp",
  b33b: RAW + "b33-blur.webp",
  b8: RAW + "b8.webp",
  b10: RAW + "b10.webp",
  b37: RAW + "b37.webp",
  e1: RAW + "energy.png",
  e2: RAW + "energy-h.png",
  e3: RAW + "energy-v.png",
  f1v: RAW + "f1-vblur.webp",
  f6v: RAW + "f6-vblur.webp",
  f6: RAW + "f6.webp",
}
for (const url of Object.values(src)) { const i = new Image(); i.src = url }

const sprite = document.getElementById("sprite")
const slash = document.getElementById("slash")
const glow = document.getElementById("glow")
let state = "idle"
let timer = null
let energyTimer = null
let right = false
let left = false
let up = false

function show(name) {
  if (sprite.dataset.name === name) return
  sprite.dataset.name = name
  sprite.src = src[name]
}
function setSlash(on) {
  if (energyTimer) { clearTimeout(energyTimer); energyTimer = null }
  if (!on) {
    slash.style.display = "none"
    glow.style.display = "none"
    return
  }
  const frames = [src.e1, src.e2, src.e3, src.e1]
  const nudge = [17, 14, 20, 17]
  let i = 0
  function showFrame() {
    slash.src = frames[i]
    glow.src = frames[i]
    slash.style.top = "calc(39.7% + 100% * " + nudge[i] + " / 730)"
    slash.style.display = "block"
    glow.style.display = "block"
  }
  showFrame()
  function step() {
    i++
    if (i >= frames.length) return
    showFrame()
    energyTimer = setTimeout(step, 25)
  }
  energyTimer = setTimeout(step, 25)
}
function clearTimer() {
  if (timer) { clearTimeout(timer); timer = null }
}
function goIdle() {
  clearTimer()
  state = "idle"
  setSlash(false)
  show("idle")
}
function after(ms, fn) { timer = setTimeout(fn, ms) }

function startWalk() {
  clearTimer()
  setSlash(false)
  state = "toWalk"
  const steps = ["w2", "w3"]
  let i = 0
  function next() {
    if (!right) { goIdle(); return }
    if (i >= steps.length) { state = "walking"; show("walk"); return }
    show(steps[i++])
    after(100, next)
  }
  next()
}
function startBlock() {
  clearTimer()
  setSlash(false)
  state = "toBlock"
  const steps = ["b9", "b12"]
  let i = 0
  function next() {
    if (!left) { startRecover(); return }
    if (i >= steps.length) { state = "blocking"; show("b18"); return }
    show(steps[i++])
    after(50, next)
  }
  next()
}
function startRecover() {
  clearTimer()
  setSlash(false)
  state = "fromBlock"
  const steps = ["b31", "b35"]
  let i = 0
  function next() {
    if (i >= steps.length) {
      goIdle()
      if (left) startBlock()
      else if (right) startWalk()
      else if (up) startUp()
      return
    }
    show(steps[i++])
    after(50, next)
  }
  next()
}
function finishSlash() {
  const resumeLeft = left
  const resumeRight = right
  const resumeUp = up
  goIdle()
  if (resumeLeft) startBlock()
  else if (resumeRight) startWalk()
  else if (resumeUp) startUp()
}
function startSlash() {
  clearTimer()
  state = "slashWind"
  setSlash(false)
  const wind = ["b8", "b10", "b12"]
  let i = 0
  function windNext() {
    if (i >= wind.length) { hit(); return }
    show(wind[i++])
    after(50, windNext)
  }
  function hit() {
    state = "slashHit"
    show("b33b")
    setSlash(true)
    after(100, () => {
      if (state !== "slashHit") return
      setSlash(false)
      show("b33")
      after(100, () => {
        if (state !== "slashHit") return
        back()
      })
    })
  }
  function back() {
    state = "slashBack"
    const steps = ["b35", "b37"]
    let j = 0
    function next() {
      if (j >= steps.length) { finishSlash(); return }
      show(steps[j++])
      after(50, next)
    }
    next()
  }
  windNext()
}

function startUp() {
  clearTimer()
  setSlash(false)
  state = "toUp"
  const steps = ["f1v", "f6v"]
  let i = 0
  function next() {
    if (!up) { goIdle(); return }
    if (i >= steps.length) { state = "hold4"; show("f6"); return }
    show(steps[i++])
    after(50, next)
  }
  next()
}

function pressRight() {
  if (right) return
  right = true
  if (state === "slashWind" || state === "slashHit" || state === "slashBack") return
  if (state === "toUp" || state === "hold4") up = false
  if (state === "idle" || state === "toUp" || state === "hold4") startWalk()
  else if (state === "toBlock" || state === "blocking") { left = false; startWalk() }
}
function releaseRight() {
  if (!right) return
  right = false
  if (state === "toWalk" || state === "walking") goIdle()
}
function pressLeft() {
  if (left) return
  left = true
  if (state === "slashWind" || state === "slashHit" || state === "slashBack") return
  if (state === "toUp" || state === "hold4") up = false
  if (state === "idle" || state === "toUp" || state === "hold4") startBlock()
  else if (state === "toWalk" || state === "walking") { right = false; startBlock() }
}
function releaseLeft() {
  if (!left) return
  left = false
  if (state === "toBlock" || state === "blocking") startRecover()
}
function pressSlash() {
  if (state === "slashWind" || state === "slashHit" || state === "slashBack") return
  if (state === "toBlock" || state === "blocking" || state === "fromBlock") return
  if (state === "toWalk" || state === "walking") right = false
  if (state === "toUp" || state === "hold4") up = false
  startSlash()
}
function pressUp() {
  if (up) return
  up = true
  if (state === "slashWind" || state === "slashHit" || state === "slashBack") return
  if (state === "toBlock" || state === "blocking" || state === "fromBlock") return
  if (state === "toWalk" || state === "walking") right = false
  startUp()
}
function releaseUp() {
  if (!up) return
  up = false
  if (state === "toUp" || state === "hold4") goIdle()
}

addEventListener("keydown", (e) => {
  if (e.repeat) return
  if (e.key === "ArrowRight") { e.preventDefault(); pressRight() }
  if (e.key === "ArrowLeft") { e.preventDefault(); pressLeft() }
  if (e.key === "ArrowDown") { e.preventDefault(); pressSlash() }
  if (e.key === "ArrowUp") { e.preventDefault(); pressUp() }
})
addEventListener("keyup", (e) => {
  if (e.key === "ArrowRight") releaseRight()
  if (e.key === "ArrowLeft") releaseLeft()
  if (e.key === "ArrowUp") releaseUp()
})
goIdle()
</script>
</body>
</html>
