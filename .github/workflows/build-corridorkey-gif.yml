name: Build corridor key GIF

on:
  push:
    branches: [main]
    paths:
      - "frames/corridorkey/*.png"
      - ".github/workflows/build-corridorkey-gif.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build animated GIF
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = sorted(Path("frames/corridorkey").glob("f_*.png"))
          if len(paths) < 2:
              raise SystemExit(f"Expected multiple PNG frames, found {len(paths)}")
          frames = []
          for path in paths:
              with Image.open(path) as im:
                  frames.append(im.convert("RGBA").copy())
          size = frames[0].size
          if any(frame.size != size for frame in frames):
              raise SystemExit("All PNG frames must have the same dimensions")
          frames[0].save(
              "corridorkey.gif",
              save_all=True,
              append_images=frames[1:],
              duration=100,
              loop=0,
              disposal=2,
              optimize=False,
          )
          print(f"Created corridorkey.gif from {len(frames)} frames ({size[0]}x{size[1]})")
          PY
      - name: Commit GIF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corridorkey.gif
          if git diff --cached --quiet; then
            echo "GIF unchanged"
          else
            git commit -m "Build corridor key animation GIF"
            git push
          fi
