<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1:1 sprite on a screen-sized canvas</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; left: 0; top: 0; z-index: 1; }
  #sprite {
    position: fixed; z-index: 2; margin: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #bar {
    position: fixed; z-index: 3; top: 12px; left: 12px;
    display: flex; gap: 8px; align-items: center;
    font: 14px/1.2 ui-sans-serif, system-ui, sans-serif; color: #eee;
  }
  button, label {
    color: inherit; background: #222; border: 1px solid #444;
    padding: 8px 10px; cursor: pointer;
  }
  #file { display: none; }
</style>
</head>
<body>
<div id="bar">
  <button id="full" type="button">Fullscreen</button>
  <label>Open sprite<input id="file" type="file" accept="image/webp,image/gif,image/png,image/*"></label>
</div>
<img id="sprite" alt="" src="https://raw.githubusercontent.com/xenodorian/BeelzSpriteAnim/main/attack_from_f01.webp">
<canvas id="view"></canvas>
<script>
const canvas = document.getElementById("view")
const ctx = canvas.getContext("2d", { alpha: false })
const sprite = document.getElementById("sprite")

const SKY = "#000000"
// Boot sole in image pixels. The attack cell is 168×256 with the sole at 244.
const KNOWN_SOLE = 244

function screenPixels() {
  const dpr = window.devicePixelRatio || 1
  return {
    dpr,
    cssW: window.screen.width,
    cssH: window.screen.height,
    pxW: Math.round(window.screen.width * dpr),
    pxH: Math.round(window.screen.height * dpr),
  }
}

function paint() {
  const { cssW, cssH, pxW, pxH } = screenPixels()
  if (canvas.width !== pxW || canvas.height !== pxH) {
    canvas.width = pxW
    canvas.height = pxH
    canvas.style.width = cssW + "px"
    canvas.style.height = cssH + "px"
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.imageSmoothingEnabled = false
  ctx.fillStyle = SKY
  ctx.fillRect(0, 0, pxW, pxH)
}

function place() {
  const dpr = window.devicePixelRatio || 1
  const sw = sprite.naturalWidth
  const sh = sprite.naturalHeight
  if (!sw || !sh) return
  const view = window.visualViewport
  const viewX = view ? view.offsetLeft : 0
  const viewY = view ? view.offsetTop : 0
  const viewW = view ? view.width : window.innerWidth
  const viewH = view ? view.height : window.innerHeight
  const sole = (sw === 168 && sh === 256) ? KNOWN_SOLE : sh
  const cssW = sw / dpr
  const cssH = sh / dpr
  sprite.style.width = cssW + "px"
  sprite.style.height = cssH + "px"
  sprite.style.left = (viewX + (viewW - cssW) / 2) + "px"
  sprite.style.top = (viewY + viewH - sole / dpr) + "px"
}

function fit() {
  paint()
  place()
}

sprite.addEventListener("load", fit)

document.getElementById("full").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen()
  else document.documentElement.requestFullscreen()
})

document.getElementById("file").addEventListener("change", (event) => {
  const file = event.target.files && event.target.files[0]
  if (!file) return
  const previous = sprite.src
  sprite.src = URL.createObjectURL(file)
  if (previous.startsWith("blob:")) URL.revokeObjectURL(previous)
})

addEventListener("resize", fit)
addEventListener("fullscreenchange", fit)
if (window.visualViewport) visualViewport.addEventListener("resize", fit)

fit()
</script>
</body>
</html>
